name: Test and Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  format-lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    - name: Install dependencies
      run: pip install .["test"]
    - name: Format code with Black
      run: |
        black openmsitoolbox --check
        black test --check
    - name: Check code with pyflakes
      run: |
        pyflakes .
        cd test
        pyflakes .
        cd ..
    - name: Lint code with pylint
      run: |
        pylint openmsitoolbox
        pylint --recursive=y test
    - name: Run tests with unittest
      run: python -m unittest discover test/test_scripts
  pypi-release:
    needs: format-lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Extract version
        id: get_version
        run: echo "VERSION=$(poetry version -s)" >> $GITHUB_ENV

      - name: Check if version already exists on PyPI
        id: check_version
        continue-on-error: true
        run: |
          curl -sSf https://pypi.org/pypi/alpss/${{ env.VERSION }}/json > /dev/null && echo "EXISTS=true" >> $GITHUB_ENV || echo "EXISTS=false" >> $GITHUB_ENV

      - name: Build and Publish to PyPI
        if: env.EXISTS == 'false'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}  
        run: |
          poetry build
          poetry publish --no-interaction

      - name: Skip PyPI publish if version exists
        if: env.EXISTS == 'true'
        run: echo "Version ${{ env.VERSION }} already exists on PyPI. Skipping release."